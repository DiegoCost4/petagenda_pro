{% extends 'base.html' %}
{% block title %}{{ 'Editar' if tutor else 'Novo' }} tutor - PetAgenda Pro{% endblock %}
{% block content %}
<div class="mb-3">
  <a href="{{ url_for('tutores.index') }}" class="text-decoration-none subtle"><i class="bi bi-arrow-left"></i> Voltar</a>
  <h1 class="page-title h3 mt-2">{{ 'Editar tutor' if tutor else 'Novo tutor' }}</h1>
</div>
<div class="card card-soft p-3 p-md-4">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-7">
        <label class="form-label">Nome do tutor *</label>
        <input class="form-control" name="nome" value="{{ tutor.nome if tutor else '' }}" required>
      </div>
      <div class="col-md-5">
        <label class="form-label">Telefone / WhatsApp *</label>
        <input class="form-control" name="telefone" value="{{ tutor.telefone if tutor else '' }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" name="email" value="{{ tutor.email if tutor else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Bairro</label>
        <input class="form-control" name="bairro" value="{{ tutor.bairro if tutor else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">Endereço</label>
        <input class="form-control" name="endereco" value="{{ tutor.endereco if tutor else '' }}">
      </div>
      <div class="col-12">
        <label class="form-label">Observações</label>
        <textarea class="form-control" name="observacoes" rows="4">{{ tutor.observacoes if tutor else '' }}</textarea>
      </div>
      {% if tutor %}
      <div class="col-12 form-check ms-2">
        <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if tutor.ativo %}checked{% endif %}>
        <label class="form-check-label" for="ativo">Tutor ativo</label>
      </div>
      {% endif %}
    </div>
    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
      <a href="{{ url_for('tutores.index') }}" class="btn btn-light">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
