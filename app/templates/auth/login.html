{% extends 'base.html' %}
{% block title %}Login - PetAgenda Pro{% endblock %}
{% block content %}
<div class="login-bg">
  <div class="card card-soft p-4 p-md-5 w-100" style="max-width: 440px;">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3" style="width:70px;height:70px;font-size:2rem"><i class="bi bi-heart-pulse-fill"></i></div>
      <h1 class="page-title h3 mb-1">PetAgenda Pro</h1>
      <p class="subtle mb-0">Controle de banho, tosa, clientes e pets.</p>
    </div>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" placeholder="admin@petagenda.local" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" name="password" class="form-control" placeholder="Sua senha" required>
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" name="remember" id="remember" checked>
        <label class="form-check-label" for="remember">Manter conectado</label>
      </div>
      <button class="btn btn-primary w-100 py-3 fw-bold">Entrar</button>
    </form>
    <!-- <div class="alert alert-info mt-4 mb-0 small">
      Primeiro acesso: <strong>admin@petagenda.local</strong><br>
      Senha: <strong>admin123</strong><br>
      Troque a senha criando outro usuário em Configurações.
    </div> -->
  </div>
</div>
{% endblock %}
